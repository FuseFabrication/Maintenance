<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuse Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1F23; --muted:#5B5F66; --line:#E2E1DC; --line2:#EDECE7; --bg:#F4F4F1; --card:#FFFFFF;
  --accent:#C2410C; --accent-dark:#9A3412; --accent-soft:#FFF7ED; --accent-line:#FED7AA;
  --ok-bg:#DCFCE7; --ok:#166534; --warn-bg:#FEF3C7; --warn:#92400E; --bad-bg:#FEE2E2; --bad:#991B1B;
  --info-bg:#E0E7FF; --info:#3730A3; --grey-bg:#EDECE7; --grey:#3F4349;
  --nav:#1C1F23; --nav2:#2E3238;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
a{color:var(--accent)} a:hover{color:var(--accent-dark)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
h1{font-size:28px} h2{font-size:19px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid #D6D5CF;border-radius:8px;background:#fff;padding:0 12px;height:44px;min-width:0}
textarea{padding:10px 12px;height:auto;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g3,.g4,.g5{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:8px;border:1px solid #D6D5CF;background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:#F9F9F7;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn.big{height:60px;font-size:18px;border-radius:12px;padding:0 24px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-info{background:var(--info-bg);color:var(--info)} .c-grey{background:var(--grey-bg);color:var(--grey)} .c-acc{background:#FFEDD5;color:var(--accent-dark)}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.card.flush{padding:0;overflow:hidden}
.card h2{margin-bottom:12px}
.notice{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:14px 18px}
.err{background:var(--bad-bg);border:1px solid #FCA5A5;color:var(--bad);border-radius:10px;padding:14px 18px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .n{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}.bar>div{height:8px;background:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#F9F9F7;padding:10px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line2);vertical-align:top}
td.tag,.tag{font-family:'Space Grotesk',sans-serif;font-weight:700;white-space:nowrap}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}
.list-item:first-child{border-top:0}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid #D6D5CF;background:#fff;font-size:13px;cursor:pointer}
.pill{color:var(--ink);text-decoration:none}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff !important;font-weight:600}
details>summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.bad{background:var(--bad)}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* office layout */
.office{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 220px;max-width:100%;background:var(--nav);color:#E7E5E4;padding:22px 14px;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 8px 22px}
.side .brand a.homelogo,.homelogo{display:block;padding:0;border-radius:6px;background:none;line-height:0}
.side .brand a.homelogo:hover,.homelogo:hover{background:none;opacity:.88}
.homelogo img{display:block;height:auto;width:100%;max-width:190px}
.fhead .homelogo img{width:170px;max-width:42vw}
.homelogo:focus-visible{outline:2px solid #fff;outline-offset:3px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-family:'Space Grotesk',sans-serif;color:#fff;font-size:16px;display:block}
.brand span{font-size:12px;color:#A8A29E}
.side a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:6px;color:#D6D3D1;text-decoration:none;font-size:14px}
.side a:hover{background:var(--nav2);color:#fff}
.side a.on{background:var(--nav2);color:#fff;font-weight:600}
.side .foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid #3A3F46;font-size:13px;color:#A8A29E;display:flex;flex-direction:column;gap:8px}
.side .foot button{background:none;border:0;color:#FDBA74;padding:0;text-align:left;cursor:pointer;font-weight:600}
.main{flex:999 1 560px;min-width:0;padding:30px 36px 48px;display:flex;flex-direction:column;gap:22px}
@media (max-width:700px){.main{padding:20px 16px 40px}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}

/* floor (tablet) layout */
.floor{min-height:100vh;display:flex;flex-direction:column}
.fhead{background:var(--nav);color:#fff;padding:16px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.fhead a,.fhead button.link{color:#FDBA74;font-weight:600;text-decoration:none;background:none;border:0;cursor:pointer;padding:0;font-size:14px}
.fhead .who{font-size:14px;color:#D6D3D1}.fhead .who b{color:#fff}
.fmain{width:100%;max-width:920px;margin:0 auto;padding:24px 28px 40px;display:flex;flex-direction:column;gap:20px;flex:1}
@media (max-width:600px){.fmain{padding:18px 14px 32px}.fhead{padding:14px 16px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mtile{min-height:128px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.mtile:hover{border-color:#A8A29E;color:var(--ink)}
.mtile.due{border:2px solid var(--accent)}
.mtile .t{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700}
.person{min-height:84px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left}
.person:hover{border-color:#A8A29E}
.avatar{width:46px;height:46px;border-radius:999px;background:var(--grey-bg);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;flex-shrink:0}
.qitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qitem.no{border-color:#FCA5A5}
.qitem .q{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.qitem .q .txt{flex:1 1 320px;display:flex;gap:12px}
.yn{display:flex;gap:8px}
.yn button{min-width:120px;height:56px;border-radius:10px;border:1px solid #D6D5CF;background:#fff;font-size:16px;font-weight:700;cursor:pointer}
.yn button.yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.choice{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 18px;background:#fff;border:1px solid #D6D5CF;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;flex-direction:row}
.choice input{width:24px;height:24px;accent-color:var(--accent)}
.choice:has(input:checked){border:2px solid var(--accent);background:var(--accent-soft);font-weight:600}
.statusbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.statusbtns button{height:76px;border-radius:12px;border:1px solid #D6D5CF;background:#fff;font-size:17px;font-weight:700;cursor:pointer}
.statusbtns button[aria-pressed="true"].s-running{background:var(--ok);border-color:var(--ok);color:#fff}
.statusbtns button[aria-pressed="true"].s-limited{background:#B45309;border-color:#B45309;color:#fff}
.statusbtns button[aria-pressed="true"].s-down{background:var(--bad);border-color:var(--bad);color:#fff}
.label-print{display:none}
@media print{body *{visibility:hidden}.label-print,.label-print *{visibility:visible}.label-print{display:block;position:fixed;inset:0;padding:24px}}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="print-area" class="label-print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
